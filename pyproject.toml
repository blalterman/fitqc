[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitqc"
version = "0.1.0"
description = "Fit QC diagnostics for detecting optimizer stickiness in fitted parameters"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "B. L. Alterman" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "kneed>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyarrow>=14.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
]

[project.urls]
Repository = "https://github.com/blalterman/fitqc"
Documentation = "https://fitqc.readthedocs.io/"

[tool.hatch.build.targets.wheel]
packages = ["src/fitqc"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["docs", "notebooks", "tmp"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["fitqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
